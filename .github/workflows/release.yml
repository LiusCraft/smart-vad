name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            label: darwin-arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            label: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install onnxruntime (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION=1.21.0
          ARCH=arm64
          curl -sLO "https://github.com/microsoft/onnxruntime/releases/download/v${VERSION}/onnxruntime-osx-${ARCH}-${VERSION}.tgz"
          tar xzf "onnxruntime-osx-${ARCH}-${VERSION}.tgz"
          cp "onnxruntime-osx-${ARCH}-${VERSION}/lib/libonnxruntime.${VERSION}.dylib" libonnxruntime.dylib
          install_name_tool -id @loader_path/libonnxruntime.dylib libonnxruntime.dylib
          echo "CGO_CFLAGS=-I${PWD}/onnxruntime-osx-${ARCH}-${VERSION}/include" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L${PWD} -lonnxruntime" >> $GITHUB_ENV

      - name: Install onnxruntime (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION=1.21.0
          curl -sLO "https://github.com/microsoft/onnxruntime/releases/download/v${VERSION}/onnxruntime-linux-x64-${VERSION}.tgz"
          tar xzf "onnxruntime-linux-x64-${VERSION}.tgz"
          cp "onnxruntime-linux-x64-${VERSION}/lib/libonnxruntime.so.${VERSION}" libonnxruntime.so
          echo "CGO_CFLAGS=-I${PWD}/onnxruntime-linux-x64-${VERSION}/include" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L${PWD} -lonnxruntime -Wl,-rpath,\$ORIGIN" >> $GITHUB_ENV

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o smart-vad-server-${{ matrix.label }} ./cmd/server
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o smart-vad-cli-${{ matrix.label }} ./cmd/cli

      - name: Fixup macOS binary
        if: runner.os == 'macOS'
        run: |
          otool -L smart-vad-server-${{ matrix.label }} | grep onnxruntime
          otool -L smart-vad-cli-${{ matrix.label }} | grep onnxruntime
          codesign --force --sign - smart-vad-server-${{ matrix.label }}
          codesign --force --sign - smart-vad-cli-${{ matrix.label }}
          codesign --force --sign - libonnxruntime.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-vad-${{ matrix.label }}
          path: |
            smart-vad-server-${{ matrix.label }}
            smart-vad-cli-${{ matrix.label }}
            libonnxruntime.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: smart-vad-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            smart-vad-server-*
            smart-vad-cli-*
            libonnxruntime.*
          generate_release_notes: true
